<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Banca - Pro Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        #bloqueio { position: fixed; inset: 0; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #conteudo { display: none; }
        .row-detalhe { background: #111; display: none; }
        .row-dia:hover { background: rgba(34, 197, 94, 0.05); cursor: pointer; }
        input[type="password"] { background: #1a1a1a; border: 1px solid #333; color: white; padding: 10px; border-radius: 8px; text-align: center; outline: none; }
    </style>
</head>
<body class="bg-gray-900 text-white p-5 font-sans">

    <div id="bloqueio">
        <h1 class="text-3xl font-bold text-green-500 mb-6 uppercase tracking-widest text-center">Gestão de Banca<br><span class="text-sm text-gray-500">Acesso Restrito</span></h1>
        <input type="password" id="senhaInput" placeholder="PIN">
        <button onclick="verificarSenha()" class="mt-4 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-8 rounded transition w-48 uppercase text-xs tracking-widest">Entrar</button>
    </div>

    <div id="conteudo" class="max-w-5xl mx-auto">
        <div class="flex flex-wrap justify-between items-center mb-6 border-b border-gray-700 pb-4 gap-4">
            <h1 class="text-3xl font-bold text-green-500">💰 Minha Banca Cloud</h1>
            <div class="flex items-center gap-2">
                <button onclick="exportarBackup()" class="text-[10px] bg-blue-900/30 hover:bg-blue-800 text-blue-400 px-3 py-1 rounded border border-blue-800 transition uppercase font-bold">Backup JSON</button>
                <button onclick="limparTudo()" class="text-[10px] bg-red-900/20 hover:bg-red-900 text-red-400 px-3 py-1 rounded transition uppercase font-bold">Limpar Nuvem</button>
            </div>
        </div>

        <div class="mb-8 bg-gray-800 p-5 rounded-lg flex flex-wrap items-center justify-between gap-4 border border-gray-700 shadow-lg">
            <div class="flex items-center gap-4">
                <span class="text-gray-400 font-bold uppercase text-xs tracking-widest">Período:</span>
                <select id="filtroMesAno" onchange="carregarDados()" class="bg-gray-700 p-2 rounded outline-none text-white focus:ring-2 ring-blue-500 text-sm">
                    <option value="todos">Todo o Histórico</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-gray-800 p-4 rounded-lg border-l-4 border-blue-500 shadow-lg">
                <p class="text-gray-400 text-[10px] uppercase font-bold">Movimentação</p>
                <p id="totalMovimento" class="text-2xl font-bold text-blue-400 font-mono">R$ 0,00</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg border-l-4 border-green-500 shadow-lg">
                <p class="text-gray-400 text-[10px] uppercase font-bold">Lucro Líquido</p>
                <p id="totalLucro" class="text-2xl font-bold text-green-400 font-mono">R$ 0,00</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg border-l-4 border-red-500 shadow-lg">
                <p id="labelImposto" class="text-gray-400 text-[10px] uppercase font-bold">Imposto (15%)</p>
                <p id="totalImposto" class="text-2xl font-bold text-red-400 font-mono">R$ 0,00</p>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg mb-8 border border-gray-700">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="date" id="data" class="bg-gray-700 p-2 rounded text-white text-sm outline-none">
                <input type="number" id="deposito" placeholder="Depósito" class="bg-gray-700 p-2 rounded text-white text-sm outline-none">
                <input type="number" id="saque" placeholder="Saque" class="bg-gray-700 p-2 rounded text-white text-sm outline-none">
                <button onclick="salvarOperacao()" class="bg-green-600 hover:bg-green-700 font-bold py-2 rounded text-white uppercase text-xs">Lançar</button>
            </div>
        </div>

        <div class="bg-gray-800 rounded-lg overflow-hidden border border-gray-700 shadow-2xl">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-700 text-gray-400 text-[10px] uppercase tracking-widest">
                    <tr>
                        <th class="p-4">Data (Clique p/ Detalhes)</th>
                        <th class="p-4 text-center">Depósitos</th>
                        <th class="p-4 text-center">Saques</th>
                        <th class="p-4 text-right">Saldo do Dia</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo" class="text-sm"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SENHA_ACESSO = "2323";
        const firebaseConfig = { databaseURL: "https://gestaobanca-547df-default-rtdb.firebaseio.com/" };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function verificarSenha() {
            if (document.getElementById("senhaInput").value === SENHA_ACESSO) {
                document.getElementById("bloqueio").style.display = "none";
                document.getElementById("conteudo").style.display = "block";
                db.ref("/").on("value", () => { atualizarFiltros(); carregarDados(); });
            } else { alert("ACESSO NEGADO"); }
        }

        function salvarOperacao() {
            const dataInput = document.getElementById('data').value;
            const dep = parseFloat(document.getElementById('deposito').value) || 0;
            const saq = parseFloat(document.getElementById('saque').value) || 0;
            if(!dataInput) return alert("Data!");
            db.ref("operacoes").push({ data: dataInput, deposito: dep, saque: saq, lucro: saq - dep });
            document.getElementById('deposito').value = ''; document.getElementById('saque').value = '';
        }

        function carregarDados() {
            const filtro = document.getElementById('filtroMesAno').value;
            const corpo = document.getElementById('tabelaCorpo');
            
            db.ref("operacoes").once("value", snapshot => {
                const dados = snapshot.val() || {};
                const agrupado = {};

                // Agrupa as operações por dia e guarda a lista de detalhes
                Object.values(dados).forEach(op => {
                    if (!agrupado[op.data]) {
                        agrupado[op.data] = { dep: 0, saq: 0, lucro: 0, detalhes: [] };
                    }
                    agrupado[op.data].dep += op.deposito;
                    agrupado[op.data].saq += op.saque;
                    agrupado[op.data].lucro += op.lucro;
                    agrupado[op.data].detalhes.push(op);
                });

                corpo.innerHTML = '';
                let tMov = 0, tLucro = 0;

                const dias = Object.keys(agrupado).filter(d => {
                    if (filtro === 'todos') return true;
                    const [ano, mes] = d.split('-');
                    return `${mes}/${ano}` === filtro;
                }).sort((a,b) => new Date(b) - new Date(a));

                dias.forEach((data, index) => {
                    const d = agrupado[data];
                    tMov += (d.dep + d.saq);
                    tLucro += d.lucro;
                    
                    // Linha Principal (Soma do Dia)
                    corpo.innerHTML += `
                        <tr class="row-dia border-t border-gray-700" onclick="toggleDetalhe(${index})">
                            <td class="p-4 font-mono text-gray-400">📅 ${data.split('-').reverse().join('/')}</td>
                            <td class="p-4 text-center">R$ ${d.dep.toFixed(2)}</td>
                            <td class="p-4 text-center text-blue-300">R$ ${d.saq.toFixed(2)}</td>
                            <td class="p-4 text-right font-bold ${d.lucro >= 0 ? 'text-green-400' : 'text-red-500'}">
                                ${d.lucro >= 0 ? '+' : ''} R$ ${d.lucro.toFixed(2)}
                            </td>
                        </tr>
                        <tr id="detalhe-${index}" class="row-detalhe border-t border-gray-800">
                            <td colspan="4" class="p-4">
                                <div class="bg-gray-900/50 rounded p-3 border border-gray-700">
                                    <p class="text-[9px] uppercase text-gray-500 mb-2 font-bold tracking-widest">Histórico Detalhado:</p>
                                    ${d.detalhes.map((det, i) => `
                                        <div class="flex justify-between text-xs py-1 border-b border-gray-800 last:border-0">
                                            <span class="text-gray-400">Op. #${i+1}</span>
                                            <span class="text-red-400">Dep: R$ ${det.deposito.toFixed(2)}</span>
                                            <span class="text-green-400">Saq: R$ ${det.saque.toFixed(2)}</span>
                                            <span class="${det.lucro >= 0 ? 'text-white' : 'text-red-600'} font-bold">Saldo: R$ ${det.lucro.toFixed(2)}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </td>
                        </tr>`;
                });

                document.getElementById('totalMovimento').innerText = `R$ ${tMov.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
                document.getElementById('totalLucro').innerText = `R$ ${tLucro.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
                const imposto = tLucro > 2826 ? tLucro * 0.15 : 0;
                document.getElementById('totalImposto').innerText = `R$ ${imposto.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            });
        }

        function toggleDetalhe(id) {
            const el = document.getElementById(`detalhe-${id}`);
            el.style.display = (el.style.display === 'table-row') ? 'none' : 'table-row';
        }

        function atualizarFiltros() {
            db.ref("operacoes").once("value", snapshot => {
                const operacoes = Object.values(snapshot.val() || {});
                const select = document.getElementById('filtroMesAno');
                const mesesAnos = [...new Set(operacoes.map(op => {
                    const [ano, mes] = op.data.split('-');
                    return `${mes}/${ano}`;
                }))].sort().reverse();
                const v = select.value;
                select.innerHTML = '<option value="todos">Todo o Histórico</option>';
                mesesAnos.forEach(p => select.innerHTML += `<option value="${p}">${p}</option>`);
                select.value = v;
            });
        }

        function exportarBackup() {
            db.ref("/").once("value", s => {
                const a = document.createElement('a');
                a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(s.val()));
                a.download = `banca_backup.json`; a.click();
            });
        }

        function limparTudo() { if(confirm("Apagar tudo da nuvem?")) db.ref("/").remove(); }
    </script>
</body>
</html>
