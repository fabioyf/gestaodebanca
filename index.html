<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Banca - Pro Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        #bloqueio { position: fixed; inset: 0; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #conteudo { display: none; }
        input[type="password"] { background: #1a1a1a; border: 1px solid #333; color: white; padding: 10px; border-radius: 8px; text-align: center; outline: none; }
    </style>
</head>
<body class="bg-gray-900 text-white p-5 font-sans">

    <div id="bloqueio">
        <h1 class="text-3xl font-bold text-green-500 mb-6 uppercase tracking-widest">Acesso Restrito</h1>
        <input type="password" id="senhaInput" placeholder="DIGITE SEU PIN">
        <button onclick="verificarSenha()" class="mt-4 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-8 rounded transition">ENTRAR</button>
    </div>

    <div id="conteudo" class="max-w-5xl mx-auto">
        <div class="flex flex-wrap justify-between items-center mb-6 border-b border-gray-700 pb-4 gap-4">
            <h1 class="text-3xl font-bold text-green-500 flex items-center gap-2">💰 Minha Banca Cloud</h1>
            <div class="flex items-center gap-2">
                <button onclick="exportarBackup()" class="text-[10px] bg-blue-900/30 hover:bg-blue-800 text-blue-400 px-3 py-1 rounded border border-blue-800 transition uppercase font-bold">Exportar PC</button>
                <button onclick="limparTudo()" class="text-[10px] bg-red-900/20 hover:bg-red-900 text-red-400 px-3 py-1 rounded transition uppercase font-bold">Resetar Nuvem</button>
            </div>
        </div>

        <div id="resumoMesAtual" class="hidden mb-6 p-4 bg-green-900/10 border border-green-500/30 rounded-lg text-center">
            <span class="text-gray-400 text-xs uppercase block mb-1">Status do Mês Selecionado</span>
            <div id="badgeStatusMes" class="text-xl font-bold"></div>
        </div>

        <div class="mb-8 bg-gray-800 p-5 rounded-lg flex flex-wrap items-center justify-between gap-4 border border-gray-700 shadow-lg">
            <div class="flex items-center gap-4">
                <span class="text-gray-400 font-bold uppercase text-xs">Período:</span>
                <select id="filtroMesAno" onchange="carregarDados()" class="bg-gray-700 p-2 rounded outline-none text-white focus:ring-2 ring-blue-500 cursor-pointer text-sm">
                    <option value="todos">Todos os Meses</option>
                </select>
            </div>
            <div id="areaPagamento" class="hidden flex items-center gap-4 bg-gray-900/50 p-2 rounded-lg border border-gray-600">
                <span id="statusTexto" class="text-xs font-bold uppercase"></span>
                <button id="btnPagarMes" onclick="alternarPagamentoMes()" class="px-4 py-1 rounded text-xs font-bold transition"></button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-gray-800 p-4 rounded-lg shadow border-l-4 border-blue-500">
                <p class="text-gray-400 text-xs uppercase font-bold tracking-wider">Movimentação Total</p>
                <p id="totalMovimento" class="text-2xl font-bold text-blue-400 font-mono">R$ 0,00</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg shadow border-l-4 border-green-500">
                <p class="text-gray-400 text-xs uppercase font-bold tracking-wider">Lucro Líquido</p>
                <p id="totalLucro" class="text-2xl font-bold text-green-400 font-mono">R$ 0,00</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg shadow border-l-4 border-red-500">
                <p id="labelImposto" class="text-gray-400 text-xs uppercase font-bold tracking-wider">Imposto (15%)</p>
                <p id="totalImposto" class="text-2xl font-bold text-red-400 font-mono">R$ 0,00</p>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg mb-8 shadow-2xl border border-gray-700">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="date" id="data" class="bg-gray-700 p-2 rounded outline-none focus:ring-2 ring-green-500 text-white">
                <input type="number" id="deposito" placeholder="Depósito (R$)" class="bg-gray-700 p-2 rounded outline-none text-white">
                <input type="number" id="saque" placeholder="Saque (R$)" class="bg-gray-700 p-2 rounded outline-none text-white">
                <button onclick="salvarOperacao()" class="bg-green-600 hover:bg-green-700 font-bold py-2 rounded transition shadow-lg text-white uppercase text-sm">Lançar</button>
            </div>
        </div>

        <div class="bg-gray-800 rounded-lg overflow-hidden border border-gray-700 shadow-xl">
            <table class="w-full text-left">
                <thead class="bg-gray-700 text-gray-400 text-xs uppercase">
                    <tr>
                        <th class="p-4">Data</th>
                        <th class="p-4 text-center">Total Depósitos</th>
                        <th class="p-4 text-center">Total Saques</th>
                        <th class="p-4 text-right">Resultado do Dia</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo" class="divide-y divide-gray-700 text-sm text-white"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SENHA_ACESSO = "2323";
        const firebaseConfig = { 
            databaseURL: "https://gestaobanca-547df-default-rtdb.firebaseio.com/" 
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function verificarSenha() {
            if (document.getElementById("senhaInput").value === SENHA_ACESSO) {
                document.getElementById("bloqueio").style.display = "none";
                document.getElementById("conteudo").style.display = "block";
                db.ref("/").on("value", () => {
                    atualizarFiltros();
                    carregarDados();
                });
            } else { alert("PIN INCORRETO!"); }
        }

        function salvarOperacao() {
            const dataInput = document.getElementById('data').value;
            const deposito = parseFloat(document.getElementById('deposito').value) || 0;
            const saque = parseFloat(document.getElementById('saque').value) || 0;
            if(!dataInput) return alert("Selecione a data!");

            db.ref("operacoes").push({ data: dataInput, deposito, saque, lucro: saque - deposito });
            document.getElementById('deposito').value = '';
            document.getElementById('saque').value = '';
        }

        function carregarDados() {
            const filtro = document.getElementById('filtroMesAno').value;
            const corpo = document.getElementById('tabelaCorpo');
            
            db.ref("operacoes").once("value", snapshot => {
                const dados = snapshot.val() || {};
                const operacoes = Object.values(dados);
                
                // --- LÓGICA DE AGRUPAMENTO POR DIA ---
                const agrupado = {};
                operacoes.forEach(op => {
                    const data = op.data;
                    if (!agrupado[data]) {
                        agrupado[data] = { deposito: 0, saque: 0, lucro: 0 };
                    }
                    agrupado[data].deposito += op.deposito;
                    agrupado[data].saque += op.saque;
                    agrupado[data].lucro += op.lucro;
                });

                corpo.innerHTML = '';
                let tMov = 0, tLucro = 0;

                // Transforma o objeto agrupado em array e filtra pelo mês selecionado
                const diasFiltrados = Object.keys(agrupado).filter(data => {
                    if (filtro === 'todos') return true;
                    const [ano, mes] = data.split('-');
                    return `${mes}/${ano}` === filtro;
                }).sort((a,b) => new Date(b) - new Date(a));

                diasFiltrados.forEach(data => {
                    const dia = agrupado[data];
                    tMov += (dia.deposito + dia.saque);
                    tLucro += dia.lucro;
                    
                    const corResultado = dia.lucro > 0 ? 'text-green-400' : (dia.lucro < 0 ? 'text-red-500' : 'text-gray-400');
                    const sinal = dia.lucro > 0 ? '+' : '';

                    corpo.innerHTML += `
                        <tr class="hover:bg-gray-700/50 transition">
                            <td class="p-4 font-mono text-gray-400">${data.split('-').reverse().join('/')}</td>
                            <td class="p-4 text-center">R$ ${dia.deposito.toFixed(2)}</td>
                            <td class="p-4 text-center text-blue-300">R$ ${dia.saque.toFixed(2)}</td>
                            <td class="p-4 text-right font-bold ${corResultado}">
                                <span class="bg-gray-900/50 px-2 py-1 rounded">${sinal} R$ ${dia.lucro.toFixed(2)}</span>
                            </td>
                        </tr>`;
                });

                // Atualiza cards de totais
                document.getElementById('totalMovimento').innerText = `R$ ${tMov.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
                document.getElementById('totalLucro').innerText = `R$ ${tLucro.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
                
                const imposto = tLucro > 2826 ? tLucro * 0.15 : 0;
                document.getElementById('totalImposto').innerText = `R$ ${imposto.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            });
        }

        function atualizarFiltros() {
            db.ref("operacoes").once("value", snapshot => {
                const operacoes = Object.values(snapshot.val() || {});
                const select = document.getElementById('filtroMesAno');
                const mesesAnos = [...new Set(operacoes.map(op => {
                    const [ano, mes] = op.data.split('-');
                    return `${mes}/${ano}`;
                }))].sort().reverse();
                const valorAtual = select.value;
                select.innerHTML = '<option value="todos">Todos os Meses</option>';
                mesesAnos.forEach(p => select.innerHTML += `<option value="${p}">${p}</option>`);
                select.value = valorAtual;
            });
        }

        function exportarBackup() {
            db.ref("/").once("value", s => {
                const a = document.createElement('a');
                a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(s.val()));
                a.download = `banca_nuvem.json`;
                a.click();
            });
        }

        function limparTudo() {
            if(confirm("Apagar todos os dados da nuvem?")) db.ref("/").remove();
        }
    </script>
</body>
</html>
