<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Banca 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        #bloqueio { position: fixed; inset: 0; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #conteudo { display: none; }
        .row-detalhe { background: #111; display: none; }
        input, select { background: #1a1a1a; border: 1px solid #333; color: white; padding: 10px; border-radius: 8px; outline: none; }
    </style>
</head>
<body class="bg-gray-900 text-white p-5 font-sans">

    <div id="bloqueio">
        <h1 class="text-3xl font-bold text-green-500 mb-6 uppercase tracking-widest text-center">Gestão de Banca</h1>
        <input type="password" id="senhaInput" placeholder="PIN">
        <button onclick="verificarSenha()" class="mt-4 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-8 rounded transition uppercase text-xs">Entrar</button>
    </div>

    <div id="conteudo" class="max-w-5xl mx-auto">
        <div class="flex flex-wrap justify-between items-center mb-6 border-b border-gray-700 pb-4 gap-4">
            <h1 class="text-3xl font-bold text-green-500">💰 Bem vindo, Fabio</h1>
            <div class="flex items-center gap-2">
                <select id="filtroMesAno" onchange="carregarDados()" class="text-xs bg-gray-800 border-gray-600"></select>
                <button onclick="exportarBackup()" class="text-[10px] bg-blue-900/30 hover:bg-blue-800 text-blue-400 px-3 py-1 rounded border border-blue-800 transition uppercase font-bold text-center">Exportar PC</button>
                
                <label for="importarArquivo" class="text-[10px] bg-yellow-900/30 hover:bg-yellow-800 text-yellow-400 px-3 py-1 rounded border border-yellow-800 transition uppercase font-bold text-center cursor-pointer mb-0">Importar JSON</label>
                <input type="file" id="importarArquivo" accept=".json" class="hidden" onchange="importarBackup(event)">
                
                <button onclick="limparTudo()" class="text-[10px] bg-red-900/20 hover:bg-red-900 text-red-400 px-3 py-1 rounded transition uppercase font-bold">Resetar Nuvem</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-gray-800 p-4 rounded-lg border-l-4 border-blue-500 shadow-lg">
                <p class="text-gray-400 text-[10px] uppercase font-bold">Movimentação Bruta</p>
                <p id="totalMovimento" class="text-2xl font-bold text-blue-400 font-mono">R$ 0,00</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg border-l-4 border-green-500 shadow-lg">
                <p class="text-gray-400 text-[10px] uppercase font-bold">Lucro Acumulado</p>
                <p id="totalLucro" class="text-2xl font-bold text-green-400 font-mono">R$ 0,00</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg border-l-4 border-yellow-500 shadow-lg">
                <p class="text-gray-400 text-[10px] uppercase font-bold text-yellow-500">Saldo p/ Gastar (Real)</p>
                <p id="totalDisponivel" class="text-2xl font-bold text-white font-mono">R$ 0,00</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg border-l-4 border-red-500 shadow-lg">
                <p class="text-gray-400 text-[10px] uppercase font-bold">Imposto Estimado (15%)</p>
                <p id="totalImposto" class="text-2xl font-bold text-red-400 font-mono">R$ 0,00</p>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg mb-8 border-2 border-green-500/30 bg-green-900/5">
            <h3 class="text-green-500 font-bold uppercase text-xs mb-4">🧮 Calculadora de Operação</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="number" id="calcDepTotal" placeholder="Valor Depositado" class="w-full bg-gray-700 p-2 rounded text-sm">
                <input type="number" id="calcSaqueTotal" placeholder="Valor Sacado" class="w-full bg-gray-700 p-2 rounded text-sm border-green-500/50 border">
                <button onclick="calcularSimples()" class="bg-green-600 hover:bg-green-700 font-bold py-2 rounded text-white uppercase text-xs">Calcular Resultado</button>
            </div>
            <div id="resultadoCalc" class="mt-4 p-3 bg-gray-900 rounded hidden border border-gray-700 flex justify-between items-center">
                <span class="text-sm text-gray-400">Resultado: <b id="valorLucroCalc" class="text-green-400 ml-2">R$ 0,00</b></span>
                <button onclick="enviarParaLancamento()" class="text-[10px] bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded font-bold uppercase">Copiar p/ Planilha ↓</button>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg mb-8 border border-gray-700 shadow-xl">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="date" id="data" class="bg-gray-700 p-2 rounded text-white text-sm">
                <input type="number" id="deposito" placeholder="Depósito (Quanto saiu do banco)" step="0.01" class="bg-gray-700 p-2 rounded text-white text-sm">
                <input type="text" id="saque" placeholder="Saque (Quanto voltou)" class="bg-gray-700 p-2 rounded text-white text-sm">
                <button onclick="salvarOperacao()" class="bg-green-600 hover:bg-green-700 font-bold py-2 rounded text-white uppercase text-xs">Lançar Agora</button>
            </div>
        </div>

        <div class="bg-gray-800 rounded-lg overflow-hidden border border-gray-700 shadow-2xl">
            <table class="w-full text-left">
                <thead class="bg-gray-700 text-gray-400 text-[10px] uppercase tracking-widest">
                    <tr>
                        <th class="p-4">Data</th>
                        <th class="p-4 text-center">Investido</th>
                        <th class="p-4 text-center">Retornado</th>
                        <th class="p-4 text-right">Saldo Final</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo" class="text-sm"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SENHA_ACESSO = "2323";
        const firebaseConfig = { databaseURL: "https://gestaobanca-547df-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function calcularSimples() {
            const dep = parseFloat(document.getElementById('calcDepTotal').value) || 0;
            const saq = parseFloat(document.getElementById('calcSaqueTotal').value) || 0;
            const lucro = saq - dep;
            document.getElementById('resultadoCalc').classList.remove('hidden');
            document.getElementById('valorLucroCalc').innerText = `R$ ${lucro.toFixed(2)}`;
            document.getElementById('valorLucroCalc').className = lucro >= 0 ? "text-green-400 ml-2" : "text-red-400 ml-2";
        }

        function enviarParaLancamento() {
            document.getElementById('deposito').value = document.getElementById('calcDepTotal').value;
            document.getElementById('saque').value = document.getElementById('calcSaqueTotal').value;
            alert("Copiado! Confira a data e clique em Lançar Agora.");
        }

        function verificarSenha() {
            if (document.getElementById("senhaInput").value === SENHA_ACESSO) {
                document.getElementById("bloqueio").style.display = "none";
                document.getElementById("conteudo").style.display = "block";
                db.ref("/").on("value", () => { atualizarFiltros(); carregarDados(); });
            } else { alert("PIN INCORRETO!"); }
        }

        function salvarOperacao() {
            const dataInput = document.getElementById('data').value;
            const dep = parseFloat(document.getElementById('deposito').value) || 0;
            const saq = parseFloat(document.getElementById('saque').value.replace(',', '.')) || 0;
            if(!dataInput) return alert("Selecione a data!");
            db.ref("operacoes").push({ data: dataInput, deposito: dep, saque: saq });
            document.getElementById('deposito').value = ''; document.getElementById('saque').value = '';
        }

        function deletarOperacao(id) {
            if(confirm("Deseja apagar este lançamento?")) db.ref("operacoes/" + id).remove();
        }

        function atualizarFiltros() {
            const select = document.getElementById('filtroMesAno');
            const valorAtual = select.value;
            db.ref("operacoes").once("value", s => {
                const ops = s.val() || {};
                const meses = [...new Set(Object.values(ops).map(o => o.data.substring(0, 7)))].sort().reverse();
                select.innerHTML = '<option value="todos">Todos os Meses</option>';
                meses.forEach(m => { select.innerHTML += `<option value="${m}">${m.split('-').reverse().join('/')}</option>`; });
                if(valorAtual && [...select.options].some(opt => opt.value === valorAtual)) select.value = valorAtual;
            });
        }

        function carregarDados() {
            const filtro = document.getElementById('filtroMesAno').value;
            const corpo = document.getElementById('tabelaCorpo');
            db.ref("operacoes").once("value", snapshot => {
                const operacoes = snapshot.val() || {};
                const agrupado = {};
                let tMov = 0, tLucroBruto = 0, tSaldoGeral = 0;

                Object.keys(operacoes).forEach(key => {
                    const op = operacoes[key];
                    const mesOp = op.data.substring(0, 7);
                    if (filtro !== 'todos' && mesOp !== filtro) return;

                    const resultado = op.saque - op.deposito;
                    if (!agrupado[op.data]) agrupado[op.data] = { dep: 0, saq: 0, lucro: 0, detalhes: [] };
                    
                    agrupado[op.data].dep += op.deposito;
                    agrupado[op.data].saq += op.saque;
                    agrupado[op.data].lucro += resultado;
                    agrupado[op.data].detalhes.push({ ...op, id: key, res: resultado });
                    
                    tMov += (Math.abs(op.deposito) + Math.abs(op.saque));
                    
                    // Lucro Bruto (Apenas o que rendeu positivo para base de imposto)
                    if (resultado > 0) tLucroBruto += resultado;
                    
                    // Saldo Geral (Abate perdas e lucros - Saldo p/ Gastar)
                    tSaldoGeral += resultado;
                });

                corpo.innerHTML = '';
                Object.keys(agrupado).sort((a,b) => new Date(b) - new Date(a)).forEach((data, index) => {
                    const d = agrupado[data];
                    corpo.innerHTML += `
                        <tr class="border-t border-gray-700 hover:bg-gray-800 cursor-pointer" onclick="toggleDetalhe(${index})">
                            <td class="p-4 font-mono text-gray-400">📅 ${data.split('-').reverse().join('/')}</td>
                            <td class="p-4 text-center">R$ ${d.dep.toFixed(2)}</td>
                            <td class="p-4 text-center text-blue-300">R$ ${d.saq.toFixed(2)}</td>
                            <td class="p-4 text-right font-bold ${d.lucro >= 0 ? 'text-green-400' : 'text-red-500'}">R$ ${d.lucro.toFixed(2)}</td>
                        </tr>
                        <tr id="detalhe-${index}" class="row-detalhe border-t border-gray-800">
                            <td colspan="4" class="p-4">
                                <div class="bg-gray-900 rounded p-2 border border-gray-700">
                                    ${d.detalhes.map(det => `<div class="flex justify-between items-center text-[10px] p-2 border-b border-gray-800 last:border-0">
                                        <span class="text-red-400">Dep: R$ ${det.deposito.toFixed(2)}</span>
                                        <span class="text-blue-400">Saq: R$ ${det.saque.toFixed(2)}</span>
                                        <span class="font-bold ${det.res >= 0 ? 'text-green-400' : 'text-red-500'}">RES: R$ ${det.res.toFixed(2)}</span>
                                        <button onclick="event.stopPropagation(); deletarOperacao('${det.id}')" class="text-red-600 font-bold ml-2">🗑️</button>
                                    </div>`).join('')}
                                </div>
                            </td>
                        </tr>`;
                });

                document.getElementById('totalMovimento').innerText = `R$ ${tMov.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
                document.getElementById('totalLucro').innerText = `R$ ${tLucroBruto.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
                document.getElementById('totalDisponivel').innerText = `R$ ${tSaldoGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
                document.getElementById('totalDisponivel').className = tSaldoGeral >= 0 ? "text-2xl font-bold text-white font-mono" : "text-2xl font-bold text-red-500 font-mono";

                const impostoTotal = tLucroBruto > 5000 ? (tLucroBruto - 5000) * 0.15 : 0;
                document.getElementById('totalImposto').innerText = `R$ ${impostoTotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            });
        }

        function toggleDetalhe(id) {
            const el = document.getElementById(`detalhe-${id}`);
            el.style.display = (el.style.display === 'table-row') ? 'none' : 'table-row';
        }

        function exportarBackup() {
            db.ref("/").once("value", s => {
                const a = document.createElement('a');
                a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(s.val()));
                a.download = `backup_gestao_fabio.json`; a.click();
            });
        }
        
        // Nova função de Importação de JSON
        function importarBackup(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const dados = JSON.parse(e.target.result);
                    if (confirm("ATENÇÃO: Importar este backup vai APAGAR e SUBSTITUIR todos os dados atuais na nuvem. Deseja continuar?")) {
                        db.ref("/").set(dados)
                            .then(() => alert("Backup importado com sucesso! Os dados já foram atualizados."))
                            .catch((erro) => alert("Erro ao importar para a nuvem: " + erro.message));
                    }
                } catch (erro) {
                    alert("Erro ao ler o arquivo. Certifique-se de que é um JSON de backup válido.");
                }
                // Limpa o campo para permitir selecionar o mesmo arquivo novamente, se necessário
                event.target.value = '';
            };
            reader.readAsText(arquivo);
        }

        function limparTudo() { if(confirm("Apagar TUDO da nuvem?")) db.ref("/").remove(); }
    </script>
</body>
</html>
